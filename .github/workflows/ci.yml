name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dala_user
          POSTGRES_PASSWORD: dala_password
          POSTGRES_DB: dala_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dala_user -d dala_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: ci
      POSTGRES_USER: dala_user
      POSTGRES_PASSWORD: dala_password
      POSTGRES_DB: dala_db
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      SECRET_KEY: ci-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      GROQ_API_KEY: ci-dummy-key
      MINIMAX_API_KEY: ''
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Start backend server
        run: nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/dala-backend.log 2>&1 &

      - name: Wait for backend to become healthy
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/dala-health.json; then
              cat /tmp/dala-health.json
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time."
          exit 1

      - name: Run backend smoke test
        run: python test_backend.py

      - name: Show backend logs on failure
        if: failure()
        run: cat /tmp/dala-backend.log

  web:
    name: Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

  mobile:
    name: Flutter Analyze and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Run Flutter widget tests
        run: flutter test
